name: Desplegar

# Cada push a main publica en la web de pruebas (nueva.jorgedeleonardo.com).
# Para publicar en jorgedeleonardo.com: Actions → Desplegar → Run workflow → production.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      destino:
        description: Dónde publicar
        type: choice
        options: [staging, production]
        default: staging

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ inputs.destino || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.destino || 'staging' }}
    env:
      SITE_ENV: ${{ inputs.destino || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar
        run: npm install --no-audit --no-fund --omit=optional

      - name: Generar la web
        run: node build.mjs

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Leer la infraestructura
        run: |
          STACK="jorgedeleonardo-$SITE_ENV"
          out() { aws cloudformation describe-stacks --stack-name "$STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text; }
          echo "BUCKET=$(out BucketName)" >> "$GITHUB_ENV"
          echo "DISTRIBUTION=$(out DistributionId)" >> "$GITHUB_ENV"
          echo "FUNCTION=$(out FunctionName)" >> "$GITHUB_ENV"
          echo "URL=$(out Url)" >> "$GITHUB_ENV"

      - name: Subir ficheros
        run: |
          # Imágenes, fuentes, CSS y JS: caché larga (el CSS/JS lleva ?v= con su huella)
          aws s3 sync dist/ "s3://$BUCKET/" --delete --no-progress \
            --exclude "*.html" --exclude "*.xml" --exclude "*.txt" \
            --cache-control "public, max-age=604800"
          # Páginas: siempre frescas para el navegador, un día en CloudFront
          aws s3 sync dist/ "s3://$BUCKET/" --delete --no-progress \
            --exclude "*" --include "*.html" --include "*.xml" --include "*.txt" \
            --cache-control "public, max-age=0, s-maxage=86400, must-revalidate"

      - name: Actualizar redirecciones
        run: |
          ETAG=$(aws cloudfront describe-function --name "$FUNCTION" --query ETag --output text)
          ETAG=$(aws cloudfront update-function --name "$FUNCTION" --if-match "$ETAG" \
            --function-config "Comment=Redirecciones y URLs limpias,Runtime=cloudfront-js-2.0" \
            --function-code fileb://dist-infra/viewer-request.js --query ETag --output text)
          aws cloudfront publish-function --name "$FUNCTION" --if-match "$ETAG" > /dev/null

      - name: Vaciar la caché de CloudFront
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths "/*" > /dev/null

      - name: Resumen
        run: echo "### Publicado en $URL" >> "$GITHUB_STEP_SUMMARY"
